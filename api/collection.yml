  /api/gds-bookings/v1/booking-commissions/countries:
    get:
      tags:
        - Booking Commissions
      operationId: getBookingCommissionsCountries
      summary: Get Countries by Country Code
      description: >-
        ## Get Booking Commissions by Country


        This endpoint retrieves a list of countries along with their respective
        alpha-3 codes and currencies that are associated with booking
        commissions.


        ### Request


        - **Method**: GET
            
        - **Endpoint**:
        `{{base_url}}/api/gds-bookings/v1/booking-commissions/countries`
            

        ### Response


        - **Status Code**: 200 OK
            
        - **Content-Type**: application/json
            

        #### Response Body Structure


        The response will contain a JSON object with the following structure:


        - **success**: A boolean indicating the success of the request.
            
        - **data**: An array of country objects, each containing:
            
            - **country_alpha3_code**: The alpha-3 code of the country (string).
                
            - **country_name**: The name of the country (string).
                
            - **country_currency**: The currency used in the country (string).
                

