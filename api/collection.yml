  /api/gds-bookings/v1/booking-commissions/13:
    get:
      tags:
        - Booking Commissions
      operationId: getBookingCommissionById
      summary: Get By Id
      description: >-
        ## Endpoint Description


        This endpoint retrieves the commission details for a specific booking
        identified by its unique ID. The request is made using the HTTP GET
        method.


        ### Request


        - **URL:**
        `{{base_url}}/api/gds-bookings/v1/booking-commissions/{bookingId}`
            
        - **Method:** GET
            
        - **Path Parameter:**
            
            - `bookingId` (required): The unique identifier for the booking commission you wish to retrieve. In this example, the ID is `13`.
                

        ### Response


        Upon a successful request, the API will return a JSON object with the
        following structure:


        - **Status Code:** `200 OK`
            
        - **Content-Type:** `application/json`
            
        - **Response Body:**
            
            - `success` (boolean): Indicates if the request was successful.
                
            - `data` (object): Contains the commission details:
                
                - `id` (integer): The unique identifier for the commission record.
                    
                - `country_alpha3_code` (string): The alpha-3 code of the country associated with the commission.
                    
                - `currency_code` (string): The currency code applicable to the commission.
                    
                - `min_commission` (string): The minimum commission amount.
                    
                - `max_commission` (string): The maximum commission amount.
                    
                - `commission_percentage` (string): The percentage of the commission.
                    
                - `is_active` (boolean): Indicates if the commission is currently active.
                    
                - `created_at` (string): Timestamp of when the commission record was created.
                    
                - `updated_at` (string): Timestamp of the last update to the commission record.
                    
                - `country` (object): Contains details about the country:
                    
                    - `country_alpha3_code` (string): The alpha-3 code of the country.
                        
                    - `country_name` (string): The name of the country.
                        

        ### Sample Response Body


        ``` json

        {
            "success": true,
            "data": {
                "id": 13,
                "country_alpha3_code": "AGO",
                "currency_code": "USD",
                "min_commission": "10.00",
                "max_commission": "20.00",
                "commission_percentage": "10.00",
                "is_active": true,
                "created_at": "2025-10-13T14:14:17.000000Z",
                "updated_at": "2025-10-13T14:14:17.000000Z",
                "country": {
                    "country_alpha3_code": "AGO",
                    "country_name": "ANGOLA"
                }
            }
        }

         ```

        ### Notes


        - Ensure that the `bookingId` is valid and exists in the system to
        receive the correct commission details.
            
        - The response will indicate success or failure, so check the `success`
        field to confirm the outcome of your request.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{gds_user_auth_token}}
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '400':
          description: Validation error

        '401':
          description: Unauthorized

        '404':
          description: Resource not found
        
  /api/gds-bookings/v1/booking-commissions/currencies/supported:
