        This endpoint retrieves the details of a specific booking identified by
        the booking ID provided in the URL. It is useful for obtaining
        comprehensive information about a booking, including guest details,
        payment status, and hotel information.


        ### Request


        - **Method**: GET
            
        - **URL**: `{{base_url}}/api/gds-bookings/v1/bookings/{booking_id}`
            
        - **Path Parameter**:
            
            - `booking_id` (integer): The unique identifier of the booking you wish to retrieve.
                

