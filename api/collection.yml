openapi: 3.0.0
info:
  title: GDS Bookings API Collection
  description: >-
    Complete API collection for GDS Bookings module including authentication,
    booking management, and search functionality
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://your-production-domain.com
    description: Production Server
  - url: https://your-staging-domain.com
    description: Staging Server
tags:
  - name: Authentication
    description: Authentication related API endpoints.
  - name: Bookings
    description: Booking management endpoints.
  - name: Booking Commissions
    description: Booking commission and reporting endpoints.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
paths:
  /api/gds-bookings/v1/auth/register:
    post:
      tags:
        - Authentication
      operationId: registerUser
      summary: Register User
      description: >-
        # **Register User API**


        ##### Registers a new user in the GDS Bookings system.


        **Endpoint URL:**  

        `POST {{base_url}}/api/gds-bookings/v1/auth/register`


        **Required Headers:**


        - `Content-Type: application/json`
            
        - `Accept: application/json`
            

        **JSON Body Parameters:**


        - `name` (string, required): Full name of the user.
            
        - `email` (string, required): User's email address.
            
        - `password` (string, required): Password for the new account.
            
        - `password_confirmation` (string, required): Must match the password
        field.
            

        **Successful Response:**


        - **Status:** `201 Created`
            
        - **Body:** Returns a JSON object containing:
            - `success` (boolean)
                
            - `message` (string)
                
            - `data.user` (object): User details (id, name, email, timestamps)
                
            - `token` (string): Bearer authentication token
                
            - `token_type` (string)
                
            - `expires_in` (integer): Token expiry in seconds
                

        Use the returned token for authenticated requests.


        ### Sample Response Body


        ```

        {
            "success": true,
            "message": "GDS user registered successfully",
            "data": {
                "user": {
                    "id": 5,
                    "name": "Alien Luke",
                    "email": "nnajioforamara3@gmail.com",
                    "created_at": "2025-10-18T18:41:01.000000Z",
                    "updated_at": "2025-10-18T18:41:01.000000Z"
                },
                "token": "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..5nqQjE7TDFjP2P1aX3QIjaL6hrcMxwv-OtQvNq4Z0Jw",
                "token_type": "bearer",
                "expires_in": 5184000
            }
        }
         ```
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Khuram Dogar
                email: khuramdogar73@gmail.com
                password: Password123!
                password_confirmation: Password123!
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '400':
          description: Validation error

        '401':
          description: Unauthorized

        '404':
          description: Resource not found
  /api/gds-bookings/v1/auth/refresh:
    post:
      tags:
        - Authentication
      operationId: refreshToken
      summary: Refresh Token
      description: >-
        ## Refresh Token API


        This endpoint is used to refresh the authentication token. Send a POST
        request with the current bearer token in the Authorization header. On
        success, the response will include a new token, its type, and the expiry
        duration. Use the new token for subsequent authenticated requests.


        ### Sample Response Body


        ``` json

        {
            "success": true,
            "message": "Token refreshed successfully",
            "data": {
                "token": "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..lIMpm-SIjU0FvELsB9LeoBGh4x4uWUkE4ZmTImQ5io4",
                "token_type": "bearer",
                "expires_in": 5184000
            }
        }
         ```
      requestBody:
        content: {}
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{gds_user_auth_token}}
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '400':
          description: Validation error

        '401':
          description: Unauthorized

        '404':
          description: Resource not found
  /api/gds-bookings/v1/auth/login:
    post:
      tags:
        - Authentication
      operationId: loginUser
      summary: Login User
      description: >-
        **Purpose:**  

        This request authenticates a user by verifying their email and password,
        and returns an access token for subsequent API requests.


        **Endpoint:**  

        POST {{base_url}}/api/gds-bookings/v1/auth/login


        **Required Headers:**


        - `Content-Type: application/json`
            
        - `Accept: application/json`
            

        **Request Body Parameters:**


        - `email` (string, required): The user's email address.
            
        - `password` (string, required): The user's password.
            

        **Example Request Body:**


        ``` json

        {
          "email": "user@example.com",
          "password": "yourPassword123!"
        }

         ```

        **Successful Response (200):**  

        Returns a JSON object containing:


        - `success` (boolean): Indicates if login was successful.
            
        - `message` (string): Success message.
            
        - `data` (object):
            - `user` (object): User details (id, name, email, timestamps).
                
            - `token` (string): The access token to be used for authenticated requests.
                
            - `token_type` (string): Typically "bearer".
                
            - `expires_in` (integer): Token expiry duration in seconds.
                

        ### **Sample Successful Response:**


        ``` json

        {
            "success": true,
            "message": "Login successful",
            "data": {
                "user": {
                    "id": 4,
                    "name": "Khuram Dogar",
                    "email": "khuramdogar73@gmail.com",
                    "created_at": "2025-10-13T14:24:08.000000Z",
                    "updated_at": "2025-10-13T14:24:08.000000Z"
                },
                "token": "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..2z2MkwsD4RpGUKAC2peTzoLHrwKDw8UVBxy7hJdosQng",
                "token_type": "bearer",
                "expires_in": 5184000
            }
        }

         ```

        Use the returned `token` as a Bearer token in the `Authorization` header
        for subsequent authenticated requests.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: khuramdogar73@gmail.com
                password: Password123!
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '400':
          description: Validation error

        '401':
          description: Unauthorized

        '404':
          description: Resource not found
  /api/gds-bookings/v1/auth/google-login:
    post:
      tags:
        - Authentication
      operationId: googleLogin
      summary: Google Login
      description: >-
        **Purpose:**

        This endpoint allows users to authenticate or register using their
        Google account. It exchanges a Google ID token for an
        application-specific authentication token, enabling seamless login or
        sign-up via Google OAuth.


        **Required Headers:**

        - `Content-Type: application/json`

        - `Accept: application/json`


        **Request Body Parameters:**

        - `google_id_token` (string, required): The ID token received from
        Google after user authentication.

        - `name` (string, required): The full name of the user as provided by
        Google.

        - `email` (string, required): The user's email address as provided by
        Google.


        **Sample Request Body:**

        ```json

        {
          "google_id_token": "<Google ID token>",
          "name": "John Doe",
          "email": "john.doe@gmail.com"
        }

        ```


        **Expected Response Format:**

        A successful response typically returns a JSON object containing
        authentication tokens and user profile information. Example:

        ```json

        {
          "access_token": "<JWT access token>",
          "refresh_token": "<JWT refresh token>",
          "user": {
            "id": "12345",
            "name": "John Doe",
            "email": "john.doe@gmail.com"
          }
        }

        ```


        On error, a JSON object with an error message and code is returned.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                google_id_token: your_google_id_token_here
                name: John Doe
                email: john.doe@gmail.com
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '400':
          description: Validation error

        '401':
          description: Unauthorized

        '404':
          description: Resource not found
  /api/gds-bookings/v1/auth/logout:
    post:
      tags:
        - Authentication
      operationId: logout
      summary: Logout
      description: >-
        This POST request logs out the authenticated user from the GDS Bookings
        system.


        **Required Headers:**

        - `Authorization`: Bearer token for the authenticated user (e.g.,
        `Bearer {{gds_user_auth_token}}`)

        - `Accept`: `application/json`


        **Expected Response:**

        - On success (HTTP 200), returns a JSON object:
          ```json
          {
            "success": true,
            "message": "Successfully logged out"
          }
          ```
        This confirms the user has been logged out of the system.
      requestBody:
        content: {}
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{gds_user_auth_token}}
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '400':
          description: Validation error

        '401':
          description: Unauthorized

        '404':
          description: Resource not found
  /api/gds-bookings/v1/auth/me:
    get:
      tags:
        - Authentication
      operationId: getUserProfile
      summary: Get User Profile
      description: >-
        # Get User Profile API


        This GET request retrieves the authenticated user's profile information.
        It requires an Authorization header with a Bearer token and an Accept
        header set to application/json. On success, it returns a JSON response
        containing user details such as id, name, email, and timestamps for
        creation and last update.


        ### Sample Response Body


        ``` json

        {
            "success": true,
            "data": {
                "id": 2,
                "name": "Vivian Amarachi",
                "email": "va@iyene.com",
                "created_at": "2025-10-09T11:22:21.000000Z",
                "updated_at": "2025-10-09T11:22:21.000000Z"
            }
        }
         ```
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{gds_user_auth_token}}
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '400':
          description: Validation error

        '401':
          description: Unauthorized

        '404':
          description: Resource not found
  /api/gds-bookings/v1/bookings:
    post:
      tags:
        - Bookings
      operationId: createBooking
      summary: Store Booking
      description: >-
        ## Store Booking API


        This endpoint allows users to store a new hotel booking in the system.
        By sending a POST request to
        `{{base_url}}/api/gds-bookings/v1/bookings`, users can submit booking
        details including guest information, hotel details, and payment
        information.


        ### Request Body Parameters


        The request should include the following parameters in JSON format:


        - **booking_reference** (string): A unique reference for the booking.
            
        - **origin_system_code** (string): The code of the system from which the
        booking is originated.
            
        - **hotel_offer_id** (string): Identifier for the hotel offer being
        booked.
            
        - **room_quantity** (integer): The number of rooms to be booked.
            
        - **check_in_date** (string): The date when the guest will check in
        (format: YYYY-MM-DD).
            
        - **check_out_date** (string): The date when the guest will check out
        (format: YYYY-MM-DD).
            
        - **booking_status** (string): Current status of the booking (e.g.,
        confirmed).
            
        - **payment_status** (string): Current status of the payment (e.g.,
        pending).
            
        - **hotel_name** (string): Name of the hotel.
            
        - **chain_code** (string): Code representing the hotel chain.
            
        - **hotel_address** (string): Address of the hotel.
            
        - **rate_code** (string): Code representing the rate plan.
            
        - **base_price** (number): The base price of the booking.
            
        - **tax_amounts** (number): Total tax amounts applicable to the booking.
            
        - **refund_condition** (string): Conditions under which a refund can be
        issued.
            
        - **mode** (string): The mode of operation (e.g., test).
            
        - **guest_first_name** (string): First name of the guest.
            
        - **guest_last_name** (string): Last name of the guest.
            
        - **guest_title** (string): Title of the guest (e.g., Mr, Ms).
            
        - **guest_phone** (string): Phone number of the guest.
            
        - **guest_email** (string): Email address of the guest.
            
        - **payment_method** (string): Method of payment (e.g., credit_card).
            
        - **payment_type** (string): Type of payment (e.g., PREPAID).
            
        - **card_token** (string): Token for the payment card.
            
        - **guest_id** (integer): Unique identifier for the guest.
            
        - **booking_commission** (number): Commission amount for the booking.
            
        - **adults_count** (integer): Number of adults in the booking.
            
        - **children_count** (integer): Number of children in the booking.
            
        - **special_requests** (string): Any special requests made by the guest.
            
        - **price_selling_total** (number): Total selling price for the booking.
            
        - **total_amount** (number): Total amount payable for the booking.
            
        - **currency** (string): Currency code (e.g., USD).
            
        - **country_code** (string): Country code where the hotel is located.
            
        - **hotel_id** (string): Unique identifier for the hotel.
            
        - **room_type** (string): Type of room booked.
            
        - **room_description** (string): Description of the room.
            
        - **booking_confirmation_number** (string): Confirmation number for the
        booking.
            
        - **amadeus_order_id** (string): Order ID from Amadeus system.
            
        - **cancellation_deadline** (string): Deadline for cancellation (ISO
        8601 format).
            
        - **cancellation_fee** (number): Fee applicable for cancellation.
            

        ### Expected Response


        Upon a successful booking creation, the API will return a `201 Created`
        status with a JSON response containing:


        - **success** (boolean): Indicates if the booking was successfully
        created.
            
        - **message** (string): A message related to the booking process (if
        any).
            
        - **timestamp** (string): The timestamp of the response.
            
        - **data** (object): Contains details of the created booking and user
        information:
            
            - **booking** (object): Includes details such as booking ID, reference, status, payment details, guest information, hotel details, and more.
                
            - **gds_user** (object): Contains user ID and name.
                

        ``` json

        {
            "success": true,
            "message": "Booking created successfully",
            "timestamp": "2025-10-14T16:59:30.810857Z",
            "data": {
                "booking": {
                    "id": 30,
                    "booking_reference": "GDS-TES1011",
                    "origin_system_code": "AMADEUS",
                    "guest_id": 1,
                    "booking_status": "confirmed",
                    "payment_status": "pending",
                    "total_amount": "175.50",
                    "base_price": "150.00",
                    "tax_amounts": "25.50",
                    "price_selling_total": "150.75",
                    "currency": "USD",
                    "check_in_date": "2025-10-15T00:00:00.000000Z",
                    "check_out_date": "2025-10-18T00:00:00.000000Z",
                    "guest_name": "John Doe",
                    "guest_title": "Mr",
                    "guest_first_name": "John",
                    "guest_last_name": "Doe",
                    "guest_email": "va@iyene.com",
                    "guest_phone": "+2348168022619",
                    "hotel_id": "12345",
                    "hotel_name": "Grand Plaza Hotel",
                    "chain_code": "MARRIOTT",
                    "hotel_address": "123 Main Street, New York, NY 10001",
                    "hotel_offer_id": "HOTEL_OFFER_12345",
                    "room_quantity": 2,
                    "room_type": "Deluxe King Room",
                    "room_description": "Spacious room with king bed and city view",
                    "rate_code": "BAR",
                    "booking_commission": "15.75",
                    "booking_confirmation_number": "CONF123456",
                    "amadeus_order_id": "AMD789012",
                    "cancellation_deadline": "2025-10-14T12:00:00.000000Z",
                    "cancellation_fee": "50.00",
                    "refund_condition": "Non-refundable",
                    "payment_method": "credit_card",
                    "payment_type": "PREPAID",
                    "card_token": "tok_1234567890abcdef",
                    "country_code": "USA",
                    "special_requests": "Late check-in requested",
                    "adults_count": 2,
                    "children_count": 0,
                    "created_at": "2025-10-14T16:59:30.000000Z",
                    "updated_at": "2025-10-14T16:59:30.000000Z"
                },
                "gds_user": {
                    "id": 2,
                    "name": "Vivian Amarachi",
                    "email": "va@iyene.com"
                }
            }
        }

         ```

        ### Notes


        - Ensure that all required fields are filled out correctly to avoid
        errors during the booking process.
            
        - The booking will be created in a test or live environment based on the
        `mode` parameter.
            
        - Review the cancellation policy and fees before confirming the booking.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                booking_reference: GDS-TES1011
                origin_system_code: AMADEUS
                hotel_offer_id: HOTEL_OFFER_12345
                room_quantity: 2
                check_in_date: '2025-10-15'
                check_out_date: '2025-10-18'
                booking_status: confirmed
                payment_status: pending
                hotel_name: Grand Plaza Hotel
                chain_code: MARRIOTT
                hotel_address: 123 Main Street, New York, NY 10001
                rate_code: BAR
                base_price: 150
                tax_amounts: 25.5
                refund_condition: Non-refundable
                mode: test
                guest_first_name: John
                guest_last_name: Doe
                guest_title: Mr
                guest_phone: '+2348168022619'
                guest_email: va@iyene.com
                payment_method: credit_card
                payment_type: PREPAID
                card_token: tok_1234567890abcdef
                guest_id: 1
                booking_commission: 15.75
                adults_count: 2
                children_count: 0
                special_requests: Late check-in requested
                price_selling_total: 150.75
                total_amount: 175.5
                currency: USD
                country_code: USA
                hotel_id: '12345'
                room_type: Deluxe King Room
                room_description: Spacious room with king bed and city view
                booking_confirmation_number: CONF123456
                amadeus_order_id: AMD789012
                cancellation_deadline: '2025-10-14T12:00:00Z'
                cancellation_fee: 50
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{gds_user_auth_token}}
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '400':
          description: Validation error

        '401':
          description: Unauthorized

        '404':
          description: Resource not found
    get:
      tags:
        - Bookings
      operationId: searchBookings
      summary: Search Bookings
      description: >-
        ### Endpoint Description


        This endpoint retrieves booking information based on a search query. It
        allows users to filter bookings by a specific search term and paginate
        the results.


        ### Request


        **Method:** GET  

        **URL:** `{{base_url}}/api/gds-bookings/v1/bookings`


        #### Query Parameters


        - **search** (string, required): A search term to filter the bookings.
        For example, searching for "john" will return bookings related to that
        term.
            
        - **per_page** (integer, optional): The number of results to return per
        page. This parameter helps in pagination of the results.
            

        ### Response


        **Status Code:** 200  

        **Content-Type:** application/json


