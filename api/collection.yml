  /api/gds-bookings/v1/booking-commissions/14:
    put:
      tags:
        - Booking Commissions
      operationId: updateBookingCommission
      summary: Update
      description: >-
        **Purpose:**

        This PUT request updates the commission details for a specific booking
        commission entry in the GDS Bookings API. It targets the endpoint
        `/api/gds-bookings/v1/booking-commissions/{id}`, where `{id}` is the
        unique identifier of the booking commission to update.


        **Endpoint:**

        `PUT {{base_url}}/api/gds-bookings/v1/booking-commissions/14`


        **Required Headers:**

        - `Authorization: Bearer {{gds_user_auth_token}}` — A valid bearer token
        for authentication.

        - `Accept: application/json` — Indicates that the client expects a JSON
        response.


        **Request Body (JSON):**

        ```

        {
          "country_alpha3_code": "ASM",
          "currency_code": "USD",
          "min_commission": "11",
          "max_commission": "12",
          "commission_percentage": "10"
        }

        ```

        - `country_alpha3_code` (string): The 3-letter ISO country code for
        which the commission applies (e.g., "ASM" for American Samoa).

        - `currency_code` (string): The 3-letter ISO currency code (e.g., "USD"
        for US Dollar).

        - `min_commission` (string): The minimum commission amount allowed for
        this booking (as a string, e.g., "11").

        - `max_commission` (string): The maximum commission amount allowed for
        this booking (as a string, e.g., "12").

        - `commission_percentage` (string): The commission percentage to be
        applied (as a string, e.g., "10").


        **Usage:**

        Use this endpoint to update commission settings for a booking commission
        record. Ensure all required fields are provided in the JSON body. A
        successful request will update the commission details for the specified
        record.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                country_alpha3_code: ASM
                currency_code: USD
                min_commission: '11'
                max_commission: '12'
                commission_percentage: '10'
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{gds_user_auth_token}}
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '400':
          description: Validation error

        '401':
          description: Unauthorized

        '404':
          description: Resource not found
  /api/gds-bookings/v1/booking-commissions/256:
    delete:
      tags:
        - Booking Commissions
      operationId: deleteBookingCommission
      summary: Delete
      description: >-
        ### Delete Booking Commissions


        This endpoint allows you to delete a specific booking commission entry
        identified by its unique ID.


        #### Request Details


        - **Method**: DELETE
            
        - **URL**: `{{base_url}}/api/gds-bookings/v1/booking-commissions/{id}`
            
            Replace `{id}` with the unique identifier of the booking commission you wish to delete.
            

        #### Expected Response


        - **Status Code**: 200 OK
            
        - **Content-Type**: application/json
            

        The response will indicate the success of the operation:


        ``` json

        {
            "success": true,
            "message": "Booking commission deleted successfully"
        }

         ```

        #### Notes


        - Ensure that the ID provided in the URL corresponds to an existing
        booking commission to avoid errors.
            
        - A successful deletion will return a success status without any
        additional message.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: Bearer {{gds_user_auth_token}}
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '400':
          description: Validation error

        '401':
          description: Unauthorized

        '404':
          description: Resource not found
