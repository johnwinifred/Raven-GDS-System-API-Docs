    post:
      tags:
        - Booking Commissions
      operationId: createBookingCommission
      summary: Create
      description: >-
        **Purpose:**

        This POST request creates a new booking commission configuration for a
        specified country and currency in the GDS Bookings system. It allows you
        to define the minimum and maximum commission amounts, as well as the
        commission percentage applicable to bookings.


        **Endpoint:**

        `POST {{base_url}}/api/gds-bookings/v1/booking-commissions`


        **Required Headers:**

        - `Authorization: Bearer {{gds_user_auth_token}}`  
          (Replace `{{gds_user_auth_token}}` with a valid user token.)
        - `Accept: application/json`


        **Request Body Parameters (JSON):**

        - `country_alpha3_code` (string, required): The 3-letter ISO country
        code (e.g., "ASM").

        - `currency_code` (string, required): The 3-letter ISO currency code
        (e.g., "USD").

        - `min_commission` (string, required): The minimum commission amount (as
        a string, e.g., "10").

        - `max_commission` (string, required): The maximum commission amount (as
        a string, e.g., "10").

        - `commission_percentage` (string, required): The commission percentage
        to apply (as a string, e.g., "10").


        **Example Request Body:**

        ```json

        {
          "country_alpha3_code": "ASM",
          "currency_code": "USD",
          "min_commission": "10",
          "max_commission": "10",
          "commission_percentage": "10"
        }

        ```


        **Notes:**

        - All fields are required and must be provided as strings.

        - Ensure that the `Authorization` header contains a valid bearer token
        for authentication.

        - The response will confirm the creation of the commission configuration
        or provide error details if the request is invalid.


        For more details, refer to the [GDS Bookings API
        Collection](collection/44674801-3f88c2d7-c26e-4817-ac4c-6cd8da049403).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
