  /api/gds-bookings/v1/bookings/25:
    put:
      tags:
        - Bookings
      operationId: updateBooking
      summary: Update Booking
      description: >-
        ## Update Booking Status


        This endpoint allows you to update the booking details for a specific
        booking identified by its ID. The request is made using the HTTP PUT
        method and targets the endpoint
        `{{base_url}}/api/gds-bookings/v1/bookings/{booking_id}`.


        ### Request Parameters


        The request body must be in JSON format and includes the following
        parameters:


        - **booking_status** (string): The status of the booking (e.g.,
        "confirmed").
            
        - **payment_status** (string): The status of the payment (e.g.,
        "confirmed").
            
        - **check_in_date** (string): The check-in date in ISO 8601 format
        (e.g., "2025-10-17T00:00:00.000000Z").
            
        - **check_out_date** (string): The check-out date in ISO 8601 format
        (e.g., "2025-10-19T00:00:00.000000Z").
            
        - **guest_title** (string): The title of the guest (e.g., "Mr").
            
        - **guest_first_name** (string): The first name of the guest.
            
